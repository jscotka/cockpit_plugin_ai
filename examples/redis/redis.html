<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="redis.css">
    <script src="../base1/cockpit.js"></script>
</head>
<body hidden>
    <main id="main" tabindex="-1">
        <h1 id="page-title"></h1>
        <p id="page-status" role="status"></p>

        <section class="card" aria-labelledby="installation-title">
            <h2 id="installation-title"></h2>
            <p id="installation-status"></p>
            <button id="install" type="button"></button>
        </section>

        <section class="card" aria-labelledby="service-title">
            <h2 id="service-title"></h2>
            <p id="service-status" role="status"></p>
            <div class="actions">
                <button id="start" type="button"></button>
                <button id="stop" type="button"></button>
                <button id="restart" type="button"></button>
                <button id="refresh" type="button"></button>
            </div>
        </section>

        <section class="card" aria-labelledby="configuration-title">
            <h2 id="configuration-title"></h2>
            <p id="configuration-help"></p>
            <form id="configuration-form" novalidate>
                <div class="field">
                    <label for="port" id="port-label"></label>
                    <input id="port" name="port" inputmode="numeric" required>
                    <small id="port-error" class="error" role="alert"></small>
                </div>
                <div class="field">
                    <label for="bind" id="bind-label"></label>
                    <input id="bind" name="bind" required autocomplete="off">
                    <small id="bind-error" class="error" role="alert"></small>
                </div>
                <div class="field">
                    <label for="protected-mode" id="protected-mode-label"></label>
                    <select id="protected-mode" name="protected-mode">
                        <option value="yes" id="protected-yes"></option>
                        <option value="no" id="protected-no"></option>
                    </select>
                    <small id="protected-mode-error" class="error" role="alert"></small>
                </div>
                <div class="field">
                    <label for="maxmemory" id="maxmemory-label"></label>
                    <input id="maxmemory" name="maxmemory" required autocomplete="off">
                    <small id="maxmemory-error" class="error" role="alert"></small>
                </div>
                <button id="save" type="submit"></button>
                <p id="configuration-status" role="status"></p>
            </form>
        </section>

        <section class="card" aria-labelledby="metrics-title">
            <h2 id="metrics-title"></h2>
            <p id="metrics-status" role="status"></p>
            <div id="metrics" class="metrics"></div>
        </section>
    </main>
    <script src="redis.js"></script>
</body>
</html>
