<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title></title><link rel="stylesheet" href="cockpit-config.css"><script src="../base1/cockpit.js"></script></head>
<body hidden><div class="cockpit-config-root" id="cockpit-config-root" data-cockpit-config-revision="cockpit-config-v3"><main tabindex="-1">
<h1 class="pf-v6-c-title pf-m-3xl" id="title"></h1><p id="description"></p><p class="config-security-warning" id="security-warning" role="note"></p><p><span id="path-label"></span> <code id="path-status">/etc/cockpit/cockpit.conf</code></p><p id="global-status" class="config-status" role="status" aria-live="polite"></p>
<div class="pf-v6-c-tabs" id="tabs"><ul class="pf-v6-c-tabs__list" role="tablist" aria-label="" id="tab-list">
<li class="pf-v6-c-tabs__item pf-m-current" role="presentation"><button class="pf-v6-c-tabs__link" id="tab-editable" role="tab" aria-controls="panel-editable" aria-selected="true" tabindex="0" type="button"></button></li>
<li class="pf-v6-c-tabs__item" role="presentation"><button class="pf-v6-c-tabs__link" id="tab-readonly" role="tab" aria-controls="panel-readonly" aria-selected="false" tabindex="-1" type="button"></button></li>
</ul></div>
<section class="pf-v6-c-tab-content" id="panel-editable" role="tabpanel" aria-labelledby="tab-editable"><div class="config-grid" id="editable-grid"><p id="editable-state" role="status"></p></div></section>
<section class="pf-v6-c-tab-content" id="panel-readonly" role="tabpanel" aria-labelledby="tab-readonly" hidden><div class="config-grid" id="readonly-grid"><p id="readonly-state" role="status"></p></div></section>
<div class="config-actions"><button class="pf-v6-c-button pf-m-primary" id="save" type="button" disabled></button><button class="pf-v6-c-button pf-m-secondary" id="refresh" type="button" disabled></button></div>
</main></div><script src="cockpit-config-theme.js"></script><script src="cockpit-config.bundle.js"></script></body></html>
